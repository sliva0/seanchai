# The Diameter interfaces and reference points each document specifies, in
# the names a reader skims for, or for an RFC its application. Maintained by
# hand from each document's scope clause and table of contents, since titles
# word it too many ways to read it from them. `seanchai.corpus.InterfaceNames`
# reads it; the export writes it as each document summary's `interfaces`.
#
# A file of its own, beside `corpus.toml` rather than a table in it: a library
# refuses a table of `corpus.toml` it does not know, and ignores this file.
#
# - Names are spelled as the specification spells them: the Diameter ones, not
#   every interface it mentions.
# - `[references]` keys a document by reference, as a From cell spells it.
#   `[documents]` keys one edition by its file's stem, where its names differ
#   from the other editions' (TS 29.212's St is not in its Release 11 edition).
# - A document with none has an empty list, so that it reads as decided. Every
#   document of the corpus has an entry; a test fails on a missing one.

