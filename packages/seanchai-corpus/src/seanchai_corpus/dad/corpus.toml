# The corpus's own description: the format its files are written in, and the
# facts resolving a citation between its documents needs, which the `.dad`
# grammar does not carry. Maintained by hand; `seanchai corpus regenerate` does
# not write it. `seanchai.corpus.Corpus.load` reads it for the directory holding
# it directly, raw mirror included, and refuses an unknown key, an entry stated
# twice and one naming a document or copy the corpus lacks
# (docs/consumers.md#resolution-across-releases).
#
# Every entry states its `evidence`: the clause or the comparison it rests on,
# read as one line of prose. A key a table's entries share is a reference as a
# re-used row's From cell spells it, `TS29.272`; a version is the copy's own.
# An entry read from a citing document's references clause names the copy
# whose clause it read, `citing_version`, and answers for that copy alone: the
# clause changes between versions, and the corpus holds several copies of some
# documents. Each copy citing alike states its own entry.

# Which generation of the `.dad` grammar and of this directory's layout the
# corpus is; a library refuses a corpus of a format it does not read
# (docs/development.md#the-corpus-format).
format = 1

# A document its citers number otherwise than its publisher does, by the
# reference a From cell carries. Corrections name the publisher's document in
# each corrected file, so this answers a raw file's From cell, which keeps what
# is printed. One entry per misnaming, never a fuzzy match.

[[cited_as]]
cited = "ETSI-TS283.034"
document = "ETSI-ES283.034"
evidence = """
    TS 29.212 (clause 2, [37]: 'ETSI TS 283 034 v2.2.0'), 29.219, 29.273 and
    32.299 cite the e4 document as a Technical Specification; ETSI publishes
    V2.2.0 as an ETSI Standard, ES 283 034, the title its transcription carries,
    and has no TS 283 034
    """

# The version a specific reference names, by citing reference, citing version
# and cited reference, read from that copy's references clause: "For a specific
# reference, subsequent revisions do not apply" (TS 183 017 V3.2.1 clause 2,
# oneM2M TS-0004 V2.35.0 clause 2: "only the cited version applies"). A
# reference naming a release means that release's last version, which the
# downloader's catalog pins with `final = "release"` and checks against the 3GPP
# archive. A citation absent here is non-specific.

[[cited_version]]
citing = "ETSI-TS183.017"
citing_version = "3.2.1"
cited = "TS29.209"
version = "6.8.0"
evidence = """
    ETSI TS 183 017 V3.2.1 clause 2.1, [4] ETSI TS 129 209: 'Universal Mobile
    Telecommunications System (UMTS); Policy control over Gq interface (3GPP TS
    29.209 Release 6)'. V6.8.0 is Release 6's last
    """

[[cited_version]]
citing = "ETSI-TS183.017"
citing_version = "3.2.1"
cited = "TS29.214"
version = "7.12.0"
evidence = """
    ETSI TS 183 017 V3.2.1 clause 2.1, [19] ETSI TS 129 214: 'Universal Mobile
    Telecommunications System (UMTS); LTE; Policy and charging control over Rx
    reference point (3GPP TS 29.214 Release 7)'. V7.12.0 is Release 7's last
    """

[[cited_version]]
citing = "oneM2M-TS-0004"
citing_version = "2.35.0"
cited = "TS32.299"
version = "11.20.0"
evidence = """
    oneM2M TS-0004 V2.35.0 clause 2.1, [31] 3GPP TS 32.299: 'Telecommunication
    management; Charging management; Diameter charging applications (Release
    11)'. V11.20.0 is Release 11's last
    """

# A non-specific citation by a copy of a document outside 3GPP whose own
# references clause says what one means: the latest edition, which is the
# newest copy the corpus holds. One entry per citation, by citing reference,
# citing version and cited reference, quoting the clause; a citation without
# one means the document's final version or nothing.

# ETSI ES 283 035 V2.5.1 clause 2.1 [7].
[[latest_edition]]
citing = "ETSI-ES283.035"
citing_version = "2.5.1"
cited = "TS29.329"
evidence = """
    clause 2.1: 'For non-specific references, the latest edition of the
    referenced document (including any amendments) applies', and [7] ETSI TS 129
    329 names no version
    """

# A document's final version: the last 3GPP published, in any release. A
# non-specific reference from a release after it means it, there being no
# version in the citing document's release to mean (the extension of TR 21.801
# clause 6.6.6.5.3, "the latest version of the referenced TS or TR in the
# Release in question", this corpus makes; docs/consumers.md). The downloader's
# catalog pins each with `final = "document"` and fails a download whose archive
# listing holds a later version.

[[final_version]]
document = "TS29.140"
version = "7.0.0"
evidence = """
    TS 29.140 (MM10) ends at Release 7; TS 32.299 clause 2 [213] cites it
    non-specifically
    """

[[final_version]]
document = "TS29.209"
version = "6.8.0"
evidence = """
    TS 29.209 (Gq) ends at Release 6, superseded by TS 29.214; ETSI ES 283 034
    V2.2.0 clause 2 [5] cites it non-specifically, 'ETSI TS 129 209: ... (3GPP
    TS 29.209)'
    """

# The revision a citation of a 3GPP2 document names, by citing reference, citing
# version and cited reference, read from that copy's references clause. 3GPP2
# numbers revisions of a document (X.S0057-0, -A, -B) as 3GPP numbers releases,
# each with versions of its own, and a spec-ref keeps no revision letter, so the
# revision a reference names is recorded here, as `cited_version` records
# versions. It is a specific reference: that revision answers it and no other,
# unless a `stand_in` says one does.

[[cited_revision]]
citing = "TS29.212"
citing_version = "11.19.0"
cited = "3GPP2-X.S0057"
revision = "B"
evidence = """
    TS 29.212 V11.19.0 clause 2, [24] 3GPP2 X.S0057-B: 'E-UTRAN - eHRPD
    Connectivity and Interworking: Core Network Aspects'
    """

[[cited_revision]]
citing = "TS29.212"
citing_version = "19.1.0"
cited = "3GPP2-X.S0057"
revision = "B"
evidence = """
    TS 29.212 V19.1.0 clause 2, [24] 3GPP2 X.S0057-B: 'E-UTRAN - eHRPD
    Connectivity and Interworking: Core Network Aspects'
    """

# Citations of a revision (`cited_revision`) that a held copy of another
# revision answers, keyed as the `cited_revision` they answer. One entry per
# citation, each with the evidence the cited revision is out of reach; a
# citation without one resolves to nothing while the corpus lacks its revision.

[[stand_in]]
citing = "TS29.212"
citing_version = "11.19.0"
cited = "3GPP2-X.S0057"
revision = "0"
version = "2.0"
evidence = """
    3GPP2's library publishes X.S0057-0 v1.0 and v2.0 only (checked 2026-10-30
    at http://www.3gpp2.org/Public_html/Specs/index.cfm, X series)
    """

[[stand_in]]
citing = "TS29.212"
citing_version = "19.1.0"
cited = "3GPP2-X.S0057"
revision = "0"
version = "2.0"
evidence = """
    3GPP2's library publishes X.S0057-0 v1.0 and v2.0 only (checked 2026-10-30
    at http://www.3gpp2.org/Public_html/Specs/index.cfm, X series)
    """

# Non-specific citations from an older copy (TS 32.299 V11.20.0, which oneM2M
# TS-0004 [31] names) that mean their release's last version of a document the
# corpus holds only at a later release, by citing reference, citing version and
# cited reference. `meant` is the version the citation means, `version` the held
# copy answering it, and `specific` says the citing document names `meant`
# itself, where the corpus cannot pin it: TS 183 033's V6.6.0 is no release's
# last, which is what the catalog pins. One entry per citation, each with the
# evidence that the cited version and the held copy define alike everything the
# citing copy re-uses from it, members its grouped AVPs reach in the cited
# document included: code, vendor, type, every table row's flag rules, grouped
# bodies and enumerated values. A citation without one resolves to nothing while
# the corpus lacks its version. Where the two versions differ the meant version
# is pinned instead (TS 29.212 V11.19.0, TS 29.214 V11.16.0, TS 29.061 V6.15.0,
# src/seanchai/downloader/specs.toml).
#
# The copies moved from Release 18 to Release 19 on 2026-11-03, when a
# comparison of every name each citing copy reaches, grouped members included,
# found the two releases define them alike; the older comparisons carry over.

# ETSI TS 183 033 V1.2.0 clause 2.1 [2] names V6.6.0, of which clause 6.3.13
# reaches seven AVPs, printing SIP-Auth-Data-Item's body itself.
[[release_stand_in]]
citing = "ETSI-TS183.033"
citing_version = "1.2.0"
cited = "TS29.229"
meant = "6.6.0"
version = "19.1.0"
specific = true
evidence = """
    SIP-Authentication-Scheme, SIP-Authenticate, SIP-Authorization,
    SIP-Authentication-Context, SIP-Item-Number, Confidentiality-Key and
    Integrity-Key compared 2026-11-03 with table 6.3.1 of V6.6.0 from the 3GPP
    archive: the same codes, types, flag rules and May Encr.
    """

# TS 29.140 V7.0.0 clause 2 [12], reached only for 3GPP-IMSI (6.3.6).
[[release_stand_in]]
citing = "TS29.140"
citing_version = "7.0.0"
cited = "TS29.061"
meant = "7.12.0"
version = "19.1.0"
evidence = """
    compared 2026-11-02 with V7.12.0 extracted from the 3GPP archive, whose
    listing holds no later Release 7 version: both define 3GPP-IMSI as code 1,
    vendor 10415, UTF8String in clause 16.4.7; both tables 9a and 10 give
    identical flag rules and encryption cells (including their disagreement on
    M); the AVP is scalar, with no grouped body or enumerated values
    """

# TS 29.140 V7.0.0 clause 2 [11], reached only for MSISDN (6.3.2).
[[release_stand_in]]
citing = "TS29.140"
citing_version = "7.0.0"
cited = "TS29.329"
meant = "7.8.0"
version = "19.1.0"
evidence = """
