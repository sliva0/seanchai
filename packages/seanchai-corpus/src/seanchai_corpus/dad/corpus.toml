# Non-specific citations whose meant version the corpus holds and answers with,
# except for the fields named here, by citing reference, citing version and
# cited reference. A release stand-in replaces the citation's copy; this keeps
# it, for code, vendor, clause and every other AVP, and takes only what no held
# version of the citation's release states, one entry per citation: `fields`
# (`corpus.FILLABLE`: `data_type`, `flag_rules`) of the AVPs `names` lists,
# from the copy at `version`. `Avp.completed_by` names the later copy for each
# field and `Avp.across_releases` carries the rule, `later-release`, and the
# linter's `cross-release-origin` note quotes the evidence. TS 29.061 V6.15.0
# stays pinned for TS 29.210: this does not make Release 19 answer for it.

# TS 29.210 V6.7.0 clause 2 [11], table 5.3.
[[release_fill]]
citing = "TS29.210"
citing_version = "6.7.0"
cited = "TS29.061"
meant = "6.15.0"
version = "19.1.0"
names = ["3GPP-GPRS-Negotiated-QoS-Profile", "3GPP-SGSN-MCC-MNC"]
fields = ["data_type"]
evidence = """
    V6.15.0 clause 16.4.7 numbers both as RADIUS sub-attributes, 5 and 18, UTF-8
    encoded, with no Diameter type, and table 10, its only AVP table, is Gmb's;
    table 9a of V7.12.0, V11.12.0 and V19.1.0 alike types both UTF8String,
    compared 2026-11-04 with the copies extracted from the 3GPP archive. The
    type alone is taken: table 9a also puts M in Must not, and TS 29.210 clause
    5.3 says the M flag of a re-used VSA shall be set, so the flags are TS
    29.210's own (TS29.210.py#3gpp-sgsn-mcc-mnc-flags,
    TS29.210.py#3gpp-gprs-negotiated-qos-profile-flags)
    """
