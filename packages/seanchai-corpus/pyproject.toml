[project]
name = "seanchai-corpus"
version = "2026.11.11"
description = "Diameter command ABNFs and AVP definitions as .dad files"
readme = "README.md"
authors = [
    { name = "sliva0", email = "sliva0mk@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["diameter", "3gpp", "avp", "abnf", "rfc6733"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Telephony",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sliva0/seanchai"
Docs = "https://github.com/sliva0/seanchai/blob/main/docs/dad-format.md"
Explorer = "https://sliva0.github.io/seanchai-explorer/"
Issues = "https://github.com/sliva0/seanchai/issues"

[build-system]
requires = ["uv_build>=0.10.2,<0.14.0"]
build-backend = "uv_build"
