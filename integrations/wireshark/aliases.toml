# Wireshark's deliberate renames, accepted as agreement by `seanchai
# crosscheck` (docs/oracle.md). Each entry is a document's AVP that the
# dictionary names otherwise on purpose: to keep it apart from another
# document's AVP of that name, the dictionary's `name` being an XML ID,
# unique and starting with no digit; or under a prefix or abbreviation of
# its own. An entry holds only while the dictionary's entry under the
# AVP's vendor and code carries `wireshark` and agrees in type; otherwise
# the crosscheck reports it as `stale-alias`.
#
# A misspelling is no rename: those are defects, patched in 0001-0025
# beside this file. Nor is a name the document has since replaced
# (`Wildcarded-PSI`, `NAF-Hostname`), which still reports, and neither is
# a rename typed otherwise than the document (RFC 5778's
# `Chargeable-User-Identity`, OctetString, which the dictionary calls `CUI`
# and types UTF8String).
#
# `specification` is the document's SpecRef, `name` its spelling in the
# corpus, `wireshark` the dictionary's.

[[alias]]
specification = "TS29.061"
name = "TWAN-Identifier"
wireshark = "3GPP-TWAN-Identifier"
reason = """
    the 3GPP- prefix of every other code the table takes from clause 16.4.7's
    RADIUS sub-attributes
    """

