name: ci

# Runs on GitHub Actions and on Forgejo Actions, which reads this directory for
# as long as .forgejo/workflows/ does not exist. docs/development.md#ci says what
# a Forgejo instance needs. Forgejo ignores `permissions`.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The Forgejo runner serves no ubuntu-latest. Its node22 label is a container
    # with node in it, which the actions below need.
    runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'node22' }}
    steps:
      - uses: actions/checkout@v4
      # uv brings its own Python 3.14, from .python-version. The action caches
      # the managed CPython and the uv cache, keyed by the lockfile. Pruning
      # drops pre-built wheels before saving, since downloading them again is
      # about as quick, so only wheels built from source are kept. A host without
      # a cache server starts cold. Forgejo's job token means nothing to
      # github.com, the action's fallback for downloading uv, so it is withheld.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          github-token: ${{ github.server_url == 'https://github.com' && github.token || '' }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-python: true
          prune-cache: true
      - run: uv sync --locked
      # No source documents in CI: the tests that need them are deselected.
      - run: uv run pytest -m "not sources"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run rumdl check .
      - run: uv run ty check
      - run: uv run basedpyright
      - run: uv build --all-packages --no-sources
      # The wheels alone, with their declared dependencies from the index: what a
      # consumer installs, then the same with what the extractor needs.
      - run: uv venv /tmp/wheels
      - run: uv pip install --python /tmp/wheels dist/*.whl
      - run: /tmp/wheels/bin/python -I tests/smoke_installed.py
      - run: uv pip install --python /tmp/wheels "$(echo dist/seanchai-*.whl)[extract]"
      - run: /tmp/wheels/bin/python -I tests/smoke_installed.py
      - run: /tmp/wheels/bin/python -I tests/smoke_extract.py
