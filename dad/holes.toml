# The corpus's record of known holes: every name `model.Model.build` cannot
# complete and the corpus cannot complete either, with the evidence. Maintained
# by hand; `seanchai regenerate` does not write it. A default build refuses a
# hole this does not list and an entry naming no hole, and so does `seanchai
# lint --corpus dad`, so working a hole off means removing its entry
# (docs/consumers.md#known-holes).
#
# `document` is `Hole.document`, the version only for an older copy; `missing`
# is `Hole.missing`, compared exactly; `reason` follows a correction's: spec
# version and clause, and what was searched. An undefined name's block says the
# rest, in the correction its reason cites.

[[hole]]
document = "RFC4004"
name = "MIP-HA-to-MN-SPI"
missing = ["undefined"]
reason = "a required member of MIP-HA-to-MN-MSA (clause 9.4) no clause defines; clause 11.1's table lists it with no code, neither verified erratum (1462, 3234) defines it, IANA's AVP Codes registry assigns it nothing and Wireshark's dictionary has no such AVP (RFC4004.py#undefined-mip-ha-to-mn-spi)"

