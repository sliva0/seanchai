[project]
name = "seanchai"
version = "0.2.0"
description = "Machine-readable Diameter schemas from 3GPP documents and RFCs"
readme = "README.md"
authors = [
    { name = "sliva0", email = "sliva0mk@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["diameter", "3gpp", "avp", "abnf", "rfc6733"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.5.1",
    "pydantic>=2.14.3",
]

[project.optional-dependencies]
corpus = ["seanchai-corpus>=2026.11.11"]
# What reading and validating source documents takes (and lxml, through
# python-docx). The model, the export and the lookup commands import neither.
extract = [
    "pypdf[crypto]>=7.0.1",
    "python-docx>=1.2.0",
]

[project.scripts]
seanchai = "seanchai.cli:main"

[project.urls]
Homepage = "https://github.com/sliva0/seanchai"
Documentation = "https://github.com/sliva0/seanchai/tree/main/docs"
Explorer = "https://sliva0.github.io/seanchai-explorer/"
Issues = "https://github.com/sliva0/seanchai/issues"

[build-system]
requires = ["uv_build>=0.10.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "python-diameter>=0.9.0",
    "ruff>=0.17.4",
    "rumdl>=0.3.2",
    "seanchai-corpus",
    "seanchai[extract]",
    "ty>=0.0.100",
]

[tool.uv.workspace]
members = ["packages/seanchai-corpus"]

[tool.uv.sources]
seanchai-corpus = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "sources: needs the downloaded source documents under specifications/",
]

# The floor requires-python names, not the 3.14 the venv runs, so that ruff
# and both type checkers flag syntax and standard-library calls newer than it.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.rumdl]
# Line length only: the check is about formatting, not Markdown style.
enable = ["MD013"]
cache = false

# Tables and fenced code may run long, and so may a line that is one unbroken
# token or one whole link, even a link whose label could wrap. That is `stern`:
# rumdl's default also passes a line whose last word merely crosses the limit,
# and `strict` flags tables and code as well. Link targets count and columns are
# plain characters, so 80 means what `len` says.
[tool.rumdl.MD013]
line-length = 80
code-blocks = false
tables = false
stern = true
ignore-link-urls = false
length-mode = "chars"

[tool.ty.environment]
python = ".venv"
python-version = "3.12"

[tool.ty.src]
include = ["src", "packages/seanchai-corpus/src", "tests"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src", "packages/seanchai-corpus/src", "tests"]
venvPath = "."
venv = ".venv"
