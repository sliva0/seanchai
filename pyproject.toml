[project]
name = "seanchai"
version = "0.1.0"
description = "Missing machine-readable schema (generator) for Diameter protocol"
readme = "README.md"
authors = [
    { name = "sliva0", email = "sliva0mk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-docx>=1.2.0",
]

[project.scripts]
seanchai = "seanchai.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "ty>=0.0.63",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py314"
extend-exclude = ["output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src", "tests"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
