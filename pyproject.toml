[project]
name = "seanchai"
version = "0.1.0"
description = "Missing machine-readable schema (generator) for Diameter"
readme = "README.md"
authors = [
    { name = "sliva0", email = "sliva0mk@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.4.2",
    "pydantic>=2.13.4",
    "pypdf[crypto]>=6.14.2",
    "python-docx>=1.2.0",
]

[project.scripts]
seanchai = "seanchai.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "python-diameter>=0.9.0",
    "ruff>=0.16.0",
    "rumdl>=0.3.2",
    "seanchai-corpus",
    "ty>=0.0.63",
]

[tool.uv.workspace]
members = ["packages/seanchai-corpus"]

[tool.uv.sources]
seanchai-corpus = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "sources: needs the downloaded source documents under specifications/",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.rumdl]
# Line length only: the check is about formatting, not Markdown style.
enable = ["MD013"]
cache = false

# Tables and fenced code may run long, and so may a line that is one unbroken
# token or one whole link, even a link whose label could wrap. That is `stern`:
# rumdl's default also passes a line whose last word merely crosses the limit,
# and `strict` flags tables and code as well. Link targets count and columns are
# plain characters, so 80 means what `len` says.
[tool.rumdl.MD013]
line-length = 80
code-blocks = false
tables = false
stern = true
ignore-link-urls = false
length-mode = "chars"

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
include = ["src", "packages/seanchai-corpus/src", "tests"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["src", "packages/seanchai-corpus/src", "tests"]
venvPath = "."
venv = ".venv"
