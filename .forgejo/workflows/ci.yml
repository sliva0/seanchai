name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: docker
    container:
      # actions/checkout is a Node action, so the job image has to ship node.
      # uv is installed by script instead and brings its own Python 3.14.
      image: code.forgejo.org/oci/node:22-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      # The uv cache and the managed CPython, keyed by the lockfile; a
      # restore-key means a lockfile bump still starts from the old cache
      # rather than from nothing. Falls back to a plain miss if the runner
      # has no cache server configured.
      - uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv/python
          key: uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: ~/.local/bin/uv sync --locked
      # No source documents in CI: the tests that need them are deselected.
      - run: ~/.local/bin/uv run pytest -m "not sources"
      - run: ~/.local/bin/uv run ruff check .
      - run: ~/.local/bin/uv run ruff format --check .
      - run: ~/.local/bin/uv run rumdl check .
      - run: ~/.local/bin/uv run ty check
      - run: ~/.local/bin/uv run basedpyright
      - run: ~/.local/bin/uv build --all-packages --no-sources
      # The wheels alone, with their declared dependencies from the index.
      - run: ~/.local/bin/uv venv /tmp/wheels
      - run: ~/.local/bin/uv pip install --python /tmp/wheels dist/*.whl
      - run: /tmp/wheels/bin/python -I tests/smoke_installed.py
      # Drop pre-built wheels before saving, since downloading them again is
      # about as quick; only wheels built from source are kept.
      - run: ~/.local/bin/uv cache prune --ci
