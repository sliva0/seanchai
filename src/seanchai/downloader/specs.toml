# 3GPP versions the corpus holds beside the release above, because a citing
# document means them (docs/consumers.md, resolution across releases). Each
# is fetched into its own release's tree, and `final` is checked against the
# archive listing on every download: "document" claims no later version is
# archived in any release, "release" none later in its own. A version
# archived later fails the download, naming it.

# TS 32.299 clause 2 [213] cites TS 29.140 non-specifically for VAS-ID and
# VASP-ID (table 7.2.0.1, which spells them VAS-Id and VASP-Id); V7.0.0 is
# the document's last version, so a non-specific reference from any later
# release means it.
[[tgpp_pinned]]
number = "29.140"
title = "MM10 interface based on Diameter protocol; Stage 3"
version = "7.0.0"
final = "document"
reason = "Defines VAS-ID and VASP-ID, which TS 32.299 re-uses."

# ETSI ES 283 034 clause 2 [5] cites ETSI TS 129 209 "(3GPP TS 29.209)",
# non-specifically (table 11), and TS 183 017 clause 2 [4] "(3GPP TS
# 29.209 Release 6)" (table 7.3.3); Release 6 is the document's last, and
# V6.8.0 its last version.
[[tgpp_pinned]]
number = "29.209"
title = "Policy control over Gq interface"
version = "6.8.0"
final = "document"
reason = "Defines the Gq AVPs ETSI ES 283 034 and TS 183 017 re-use."

# ETSI TS 183 017 clause 2 [19] cites ETSI TS 129 214 "(3GPP TS 29.214
# Release 7)" for Codec-Data (table 7.3.5); V7.12.0 is Release 7's last.
[[tgpp_pinned]]
number = "29.214"
title = "Policy and charging control over Rx reference point"
version = "7.12.0"
final = "release"
reason = "Defines Codec-Data as ETSI TS 183 017 re-uses it."

# oneM2M TS-0004 V2.35.0 clause 2 [31] cites "3GPP TS 32.299 ... (Release
# 11)" for Node-Id and Service-Information (table A.4-1); V11.20.0 is
# Release 11's last.
[[tgpp_pinned]]
number = "32.299"
title = "Charging management; Diameter charging applications"
version = "11.20.0"
final = "release"
reason = """
    Defines Node-Id and Service-Information as oneM2M TS-0004 re-uses them.
    """

# TS 32.299 V11.20.0 clause 2 cites TS 29.212 [215] and TS 29.214 [214]
# non-specifically, which in Release 11 means Release 11's last versions.
# Their Release 18 copies differ where oneM2M TS-0004 reaches them through
# Service-Information: Release 18's QoS-Information has seven members
# Release 11's lacks, and Release 18's Flows three, `*[ AVP ]` among them.
[[tgpp_pinned]]
number = "29.212"
title = "Policy and Charging Control (PCC); Reference points"
version = "11.19.0"
final = "release"
reason = "Defines QoS-Information as TS 32.299 V11.20.0 re-uses it."

[[tgpp_pinned]]
number = "29.214"
title = "Policy and charging control over Rx reference point"
version = "11.16.0"
final = "release"
reason = "Defines Flows as TS 32.299 V11.20.0 re-uses it."

# TS 29.210 V6.7.0 clause 2 [11] cites TS 29.061 non-specifically, which in
# Release 6 means Release 6's last version. Release 18's differs for what TS
# 29.210 re-uses from it: its table 9a puts M in Must not on 3GPP-RAT-Type,
# 3GPP-SGSN-Address and 3GPP-SGSN-IPv6-Address, where V6.15.0's table 10, the
# only one tabulating them, puts it in Must. It tabulates TS 29.210's other
# two, 3GPP-GPRS-Negotiated-QoS-Profile and 3GPP-SGSN-MCC-MNC, nowhere.
[[tgpp_pinned]]
number = "29.061"
title = "PLMN interworking with packet data networks"
version = "6.15.0"
final = "release"
reason = """
    Defines 3GPP-RAT-Type and 3GPP-SGSN-Address as TS 29.210 V6.7.0 re-uses
    them.
    """

# TS 29.230 tables 4.1 and 7.1 cite three retired documents no corpus
# document resolves into; each is pinned at its last version so that the
# registry's rows point at something the corpus holds.
[[tgpp_pinned]]
number = "29.210"
title = "Charging rule provisioning over Gx interface"
version = "6.7.0"
final = "document"
reason = "Defines 3GPP Gx and Gx over Gy, which TS 29.230 table 4.1 cites."

[[tgpp_pinned]]
number = "29.211"
title = "Rx Interface and Rx/Gx signalling flows"
version = "6.4.0"
final = "document"
reason = "Defines 3GPP Rx, which TS 29.230 table 4.1 cites."

[[tgpp_pinned]]
number = "29.234"
title = """
    3GPP system to Wireless Local Area Network (WLAN) interworking; Stage 3
    """
version = "11.2.0"
final = "document"
reason = "Defines Wx and Pr, which TS 29.230 tables 4.1 and 7.1 cite."

# oneM2M specifications, each pinned to one version of one release: the
# document library serves only a document id's latest revision, so the
# version is stated here and the download fails when the file served carries
# another. Release 2 is the line TS 32.299 [301] cites; ETSI's mirror (TS 118
# 104 V2.7.1) is PDF only, and V2.35.0 prints table A.4-1, clause A.5 and
# M2M-Information's ABNF as V2.7.1 does.
[[onem2m]]
number = "0004"
title = "Service Layer Core Protocol"
release = 2
version = "2.35.0"
document_id = 36771
reason = """
    Annex A binds Mch to Diameter accounting; TS 32.299 re-uses its
    M2M-Information.
    """

# Wireshark's Diameter dictionary — the independent oracle `seanchai
# crosscheck` compares extracted codes, vendor-ids and types against. The
# whole directory is needed, not just dictionary.xml: the dictionary is split
# across per-vendor XML entity files it includes. Pinned to a release tag so
# the corpus stays reproducible; not a git submodule, because a submodule is
# a whole repository and Wireshark's history is 1.2 GB for these 32 files.
[wireshark]
tag = "v4.7.2"
path = "resources/protocols/diameter"
