# Input patches for 3GPP TS 29.229 (Cx and Dx interfaces based on Diameter).
# Applied to normalized source text before parsing; see
# src/seanchai/extractor/patches.py for the format.

[[patch]]
find = "RTR-Flags ]"
replace = "[ RTR-Flags ]"
section = "6.1.9"
reason = "the RTR ABNF prints the line without its opening bracket (docx and PDF alike), which silently truncated the body there — the extractor stops an ABNF at the first line that is not one; clause 6.3.69 defines RTR-Flags and every other command spells such members '[ Name ]'"
first_version = "18.1.0"
