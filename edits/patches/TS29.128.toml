# Input patches for 3GPP TS 29.128 (MME/SGSN interfaces to packet data networks
# and applications). Applied to normalized source text before parsing; see
# src/seanchai/extractor/patches.py for the format.

[[patch]]
find = "OctetSstring"
replace = "OctetString"
exact = true
section = "6.4.1"
reason = "table 6.4.1-1 misspells Non-IP-Data's type; clause 6.4.19 defines it as OctetString and OctetSstring is not a Diameter data type"
first_version = "18.0.0"
last_version = "18.0.0"
