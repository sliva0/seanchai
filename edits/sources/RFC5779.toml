# Source declarations for RFC 5779 (Diameter Proxy Mobile IPv6).

[[quirk]]
name = "clause-avp-table"
reason = """
    the document prints no AVP table; clauses 5.2, 5.4, 5.6, 5.7, 5.8 and 5.9
    give code and type in prose
    """

[[quirk]]
name = "prose-avp-origins"
reason = """
    clauses 5.1, 5.3 and 5.5 say their AVP is defined or 'originally defined' in
    [RFC5447], and clause 5.8 that Service-Selection 'is re-used from [RFC5778]'
    """
