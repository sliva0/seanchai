# Source declarations for 3GPP TS 29.109 (GAA; Zh and Zn interfaces based on
# Diameter). Applied to normalized source text before parsing; see
# src/seanchai/extractor/sources.py for the format.

[[patch]]
find = "OctedString"
replace = "OctetString"
count = 6
exact = true
section = "6.3"
reason = """
    table 6.1 misspells OctetString for six AVPs; their defining clauses
    describe octet strings and OctedString is not a Diameter data type
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[patch]]
find = "Synchronization Failure"
replace = ""
exact = true
section = "4.2"
reason = """
    the comment of the MAR body's '[ SIP-Auth-Data-Item ] ; Authentication
    Scheme,' wraps onto a paragraph of its own, which is no member and would
    end the body before GUSS-Timestamp and the rest
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[patch]]
find = "Diameter Header: xxx, REQ, PXY, xxxxxxxx"
replace = "Diameter Header: 312, REQ, PXY, 16777268"
section = "5.4"
reason = """
    clause 5.4 prints placeholders for GBA-Push-Info-Request's code and id, and
    a command code is a number. The document states both elsewhere, clause 6.1,
    'The Zn and Zpn interfaces assign new Command-Codes 310 and 312', and 6.0,
    'identifiers assigned to the Zn and Zpn interface application are 16777220
    and 16777268'; TS 29.230 tables 5.1/1 and 4.1 allocate the same two
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[patch]]
find = "Diameter Header: xxx, PXY, xxxxxxxx"
replace = "Diameter Header: 312, PXY, 16777268"
section = "5.4"
reason = """
    clause 5.4 prints placeholders for GBA-Push-Info-Answer's code and id; as
    for the request, from clauses 6.0 and 6.1 and TS 29.230 tables 5.1/1 and 4.1
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[patch]]
find = "GBA-Push-Info-Request message to the BSF"
replace = "GBA-Push-Info-Request message (GPR) to the BSF"
section = "5.4"
reason = """
    the document never abbreviates the GBA push commands, and a command has one;
    TS 29.230 table 5.1/1 allocates code 312 as 'GPR/GPI'
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[patch]]
find = "GBA-Push-Info-Answer message back to the NAF"
replace = "GBA-Push-Info-Answer message (GPI) back to the NAF"
section = "5.4"
reason = """
    the document never abbreviates the GBA push commands, and a command has one;
    TS 29.230 table 5.1/1 allocates code 312 as 'GPR/GPI'. This document's own
    GPI is the GBA Push Information, an AVP's content, not a command
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "procedure-commands"
reason = """
    the commands have no clauses of their own: clauses 4.2, 5.2 and 5.4 print
    each rule in a procedure step, under a sentence naming the command,
    'The NAF shall send a Bootstrapping-Info-Request message (BIR) to the BSF'
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "reprinted-avps"
reason = """
    clauses 4.2, 5.2 and 5.4 follow MAR, BIR and GPR with 'The content of
    Vendor-Specific-Application-ID according IETF RFC 6733 [33] is:' and that
    rule, glossing what its members hold in each ('; 3GPP is 10415',
    '; Omitted')
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "abnf-comments"
reason = """
    those bodies gloss most members, '{ Origin-Host } ; Address of BSF'; unread,
    each body ends at the first
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "dashed-enum-values"
reason = """
    clauses 6.3.1.11, 6.3.1.13, 6.3.1.15 and 6.3.1.17 print their values as
    dashed list items, '- GBA_ME (0) GBA_ME shall be run.'; unread, their lists
    were empty
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "worded-enum-values"
reason = """
    clauses 6.3.1.11 and 6.3.1.17 label values in words, '- 3G GBA (0)', '-
    Private identity requested (0) .'
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "described-enum-values"
reason = """
    clauses 6.3.1.8, 6.3.1.11, 6.3.1.15 and 6.3.1.22 gloss each value on its own
    line, 'NO (0) The sending node is not GBA_U aware'
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "label-after-enum-value"
reason = """
    clause 6.3.1.13 prints no name before the value and labels it after, '- (0)
    Private user identity.'
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "punctuated-enum-values"
reason = """
    clause 6.3.1.17 closes its first value with a stray full stop, '- Private
    identity requested (0) .'
    """
first_version = "18.1.0"
last_version = "18.1.0"
