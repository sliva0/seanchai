# Source declarations for 3GPP TS 29.061 (Gn/Gi/Sgi interworking).

[[quirk]]
name = "procedure-commands"
reason = """
    the command clauses are headed 'AAR Command' or 'Re-Auth-Request Command',
    naming a command by one of its two names, and only some intros print both,
    'The Abort-Session-Request (ASR) command, defined in IETF RFC 6733'
    """

[[quirk]]
name = "rfc-command-rules"
reason = """
    the other intros print the abbreviation alone, 'The AAR command, defined in
    Diameter NASREQ', over '<AA-Request>', and clause 20.4.3 has none; every
    command is RFC 6733's or RFC 7155's, which name them by command code
    """

[[quirk]]
name = "abnf-comments"
reason = """
    the bodies of the Gmb and SGmb RAR and RAA (clauses 17.6.5, 17.6.6, 20.4.1,
    20.4.2) gloss members, '[ MBMS-GGSN-Address ] ; for unicast encapsulated
    user data'; unread, each body ends at the first
    """

[[quirk]]
name = "prose-application-ids"
reason = """
    the command headers print no application id; clauses 17 and 20.1 state
    Gmb's and SGmb's
    """

[[quirk]]
name = "dotted-flags"
reason = """
    eleven flags cells write the separator as a period ('M.V'); the space-less
    form is this document's convention, unlike the 'M. V' typo class that goes
    through patches
    """

[[quirk]]
name = "clause-parenthetical"
reason = """
    the Gmb and SGmb tables annotate 37 clause cells as '16.4.7 (see Note)',
    pointing at the note about RADIUS VSAs carried as Diameter vendor AVPs per
    RFC 7155
    """

[[quirk]]
name = "worded-enum-values"
reason = """
    clause 17.7.18 labels MBMS-User-Data-Mode-Indication's value 1 in words,
    'Multicast and Unicast (1)'
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "external-enum-values"
reason = """
    clause 17.7.25 prints no values for MBMS-HC-Indicator and says 'The
    enumeration values are defined in 3GPP TS 25.413 [92].'
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "reference-points-column"
reason = """
    table 9a (clause 16a.5, Gi/SGi specific AVPs) prints an 'Applicable
    Reference Points' column naming the reference points each AVP is used on,
    separated by commas ('Gi, Sgi')
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "applicability-column"
reason = """
    table 20.5a.1 (SGmb specific AVPs) prints an 'Applicability' column of
    supported features, 'MBMS Heartbeat', 'MBMS Cell List': its note, 'AVPs
    marked with a supported feature are applicable as described in subclause
    20.7'
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "worded-marks"
reason = """
    the SGmb features are named in words ('MBMS Cell List', table 20.7.1), so a
    space is no separator; table 9a's reference points are separated by commas
    ('Gi, Sgi')
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[patch]]
find = "3GPP-Charging-ID"
replace = "3GPP-Charging-Id"
count = 2
section = "16a.4"
reason = """
    the AAR and ACR bodies (clauses 16a.4.1, 16a.4.3) misspell in case the name
    table 9a prints
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[patch]]
find = "Qos-Filter-Rule"
replace = "QoS-Filter-Rule"
count = 1
section = "16a.4"
reason = """
    the ACR body (clause 16a.4.3) misspells in case the name the AAR body and
    RFC 7155 print
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[patch]]
find = "MBMS-GGSN-Ipv6-Address"
replace = "MBMS-GGSN-IPv6-Address"
count = 1
section = "20.4"
reason = """
    the SGmb RAA body (clause 20.4.2) misspells in case the name table 10
    prints; clause 17.7.20 heads the AVP with the same misspelling, which is no
    rule and stays
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[patch]]
find = "MBMS-Session-Repetition-number"
replace = "MBMS-Session-Repetition-Number"
count = 1
section = "17.6"
reason = """
    the Gmb RAR body (clause 17.6.5) misspells in case the name table 10 prints
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[patch]]
find = "MBMS-Session-Repetition-number"
replace = "MBMS-Session-Repetition-Number"
count = 1
section = "20.4"
reason = """
    the SGmb RAR body (clause 20.4.1) misspells in case the name table 10 prints
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[patch]]
find = "MBMS-Session-Repetition-number"
replace = "MBMS-Session-Repetition-Number"
count = 1
section = "17.6"
reason = """
    the Gmb RAR body (clause 17.6.5) misspells in case the name table 10 prints
    """
first_version = "6.15.0"
last_version = "6.15.0"

[[quirk]]
name = "spaced-heading-numbers"
reason = """
    clause 17.8, Gmb's Experimental-Result-Code values, is headed with a space
    before its tab, so its codes read under no such clause
    """
first_version = "6.15.0"
last_version = "6.15.0"
