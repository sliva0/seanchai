# Source declarations for 3GPP TS 29.329 (Sh interface based on Diameter).
# Applied to normalized source text before parsing; see
# src/seanchai/extractor/sources.py for the format.

[[patch]]
find = "Push-Notifications-Answer"
replace = "Push-Notification-Answer"
count = 2  # section heading + intro prose (the ABNF rule name is correct)
section = "6.1.8"
reason = "command name pluralized in the heading and prose, but not in the rule"
first_version = "18.0.0"
last_version = "19.1.0"

[[quirk]]
name = "note-defined-in-rfc"
reason = """
    the AVP table's note reads 'The value of this attribute is defined in IETF
    RFC ...' for a code-less row, which is where that AVP's re-used origin comes
    from
    """
first_version = "18.0.0"
last_version = "19.1.0"

[[quirk]]
name = "prose-avp-origins"
reason = """
    clauses 6.3.15 and 6.3.19 refer to TS 29.229 for their AVP definitions,
    while table 6.3.1 only records their use on Sh
    """
first_version = "7.8.0"
last_version = "19.1.0"

[[quirk]]
name = "bare-avp-citations"
reason = """
    clauses 6.3.11-14, 6.3.20 and 6.3.21 are headed by their AVP and hold
    nothing but 'See 3GPP TS 29.229 [6] clause N', and 6.3.9 refers to TS
    29.229 for 'further description' of Server-Name; TS 29.230 table 7.1
    allocates each to TS 29.229, and table 6.3.1 only records their use on Sh
    """
first_version = "7.8.0"
last_version = "19.1.0"

# Sh-ee, which Release 19 adds.
[[patch]]
find = "< Diameter Header: 310, REQ, PXY, xx1 >"
replace = "< Diameter Header: 310, REQ, PXY >"
section = "8.1.1"
reason = """
    clause 8.1.1 prints a placeholder 'xx1' for the application id, and a header
    holds a number. The document states none: clause 8 says the id 'is xx1
    (allocated by IANA)' under 'Editor's Note: The value will be allocated by
    IANA', and TS 29.230 V19.3.0 table 4.1 prints 'zz', so the header goes
    without one
    """
first_version = "19.1.0"
last_version = "19.1.0"

[[patch]]
find = "< Diameter Header: 310, PXY, xx1 >"
replace = "< Diameter Header: 310, PXY >"
section = "8.1.2"
reason = "clause 8.1.2's placeholder for the application id, as in clause 8.1.1"
first_version = "19.1.0"
last_version = "19.1.0"

[[patch]]
find = "< Diameter Header: 311, PXY, xx1 >"
replace = "< Diameter Header: 311, PXY >"
section = "8.1.3"
reason = "clause 8.1.3's placeholder for the application id, as in clause 8.1.1"
first_version = "19.1.0"
last_version = "19.1.0"

[[patch]]
find = "< Diameter Header: 311, PXY, xx1 >"
replace = "< Diameter Header: 311, PXY >"
section = "8.1.4"
reason = "clause 8.1.4's placeholder for the application id, as in clause 8.1.1"
first_version = "19.1.0"
last_version = "19.1.0"

[[patch]]
find = "[ Expiry Time ]"
replace = "[ Expiry-Time ]"
section = "8.3.5"
reason = """
    Event-Reporting-Options' body spaces the name its clause's prose spells
    'Expiry Time AVP'; table 6.3.1 and clause 6.3.16 name Expiry-Time
    """
first_version = "19.1.0"
last_version = "19.1.0"

[[patch]]
find = "[ Request Current Status ]"
replace = "[ Request-Current-Status ]"
section = "8.3.10"
reason = """
    Event-List's body spaces the name; a member is one token and no other clause
    spells this one, so the hyphens are the document's own convention
    """
first_version = "19.1.0"
last_version = "19.1.0"

[[patch]]
find = "*[ Ims Event Filter ]"
replace = "*[ Ims-Event-Filter ]"
section = "8.3.10"
reason = """
    Event-List's body spaces the name table 8.3.1 and clause 8.3.12 spell
    Ims-Event-Filter
    """
first_version = "19.1.0"
last_version = "19.1.0"

[[quirk]]
name = "independent-avp-tables"
reason = """
    Sh's clause 6.3 tabulates its own AVPs and the ones it re-uses, and Sh-ee's
    table 8.3.1 only its own: Release 19 adds that table and no re-used table
    for it, so no one-to-one pairing holds
    """
first_version = "19.1.0"
last_version = "19.1.0"

[[patch]]
find = "ANY_UE_ APPLICABLE (1)"
replace = "ANY_UE_APPLICABLE (1)"
section = "8.3.1"
reason = """
    clause 8.3.1 spaces the name after its second underscore; its sibling prints
    ANY_UE_NOT_APPLICABLE (0)
    """
first_version = "19.1.0"
last_version = "19.1.0"
