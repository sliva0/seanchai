exact = true
count = 3
reason = "the DER formats (4.4.2.1, 5.5.1, 8.4.1) write RFC 4005's Calling-Station-Id with a space, and in another case; 8.4.2's AAR prints it right"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "* [ Routing Policy ]"
replace = "* [ Routing-Policy ]"
