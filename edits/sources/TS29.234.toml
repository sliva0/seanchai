exact = true
section = "10.1.16"
reason = "clause 10.1.16 breaks the value name with stray spaces; unpatched the value is silently no value"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "WLAN_ APN_INTERNET_ACCESS_BARRED (4)"
replace = "WLAN_APN_INTERNET_ACCESS_BARRED (4)"
exact = true
section = "10.1.16"
reason = "clause 10.1.16 breaks the value name with stray spaces; unpatched the value is silently no value"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "WLAN_ DIRECT_IP_ACCESS (0)"
