reason = "the DER and AAR formats (8.4.1, 8.4.2) misspell in case the name table 10.1.1 and clause 10.1.15 print"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "[ Framed-Appletalk-Link ]"
