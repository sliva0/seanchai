# Source declarations for 3GPP TS 29.234 (3GPP system to Wireless Local Area
# Network (WLAN) interworking; Stage 3), V11.2.0, the document's final
# version. Applied to normalized source text before parsing; see
# src/seanchai/extractor/sources.py for the format.

[[quirk]]
name = "prose-application-ids"
reason = "clauses 6.2 and 11.2 state the Wx and Pr ids: 'The Wx reference point shall be Diameter based and shall have an application ID defined for it. ... The application identifier is to 16777219.'; clause 11.4's command headers print none"
first_version = "11.2.0"
last_version = "11.2.0"

[[quirk]]
name = "procedure-commands"
reason = "commands sit under procedure headings, 6.4.1-6.4.3 and 11.4.1 naming them in intros: 'The Server-Assignment-Request (SAR) command, indicated by ...'"
first_version = "11.2.0"
last_version = "11.2.0"

[[quirk]]
name = "rfc-command-rules"
reason = "clauses 4.4.2, 4.5.2.2, 5.5.1, 8.4, 9.4 and 11.4.2 print RFC commands by rule alone, under intros such as 'ABNF for the ASR and ASA commands are as follows:' or none (4.4.2.3): '<ASR> ::=', '<Diameter-EAP-Request> ::='"
first_version = "11.2.0"
last_version = "11.2.0"

[[quirk]]
name = "spaced-heading-numbers"
reason = "clause 4.5.2.2's heading prints a space before its tab; unread, the ACR and ACA would read as clause 4.5.2.1's"
first_version = "11.2.0"
last_version = "11.2.0"

[[quirk]]
name = "spaced-rule-operator"
reason = "clause 10.1.4 prints 'SIP-Auth-Data-Item :: = < AVP Header : 612 >'"
first_version = "11.2.0"
last_version = "11.2.0"

[[quirk]]
name = "unknown-type-tokens"
reason = "table 10.1.1 types Charging-Characteristics 'Integer', as clause 10.1.27 does, naming no width; RFC 6733 has no such type, so the cell stays as printed"
first_version = "11.2.0"
last_version = "11.2.0"

[[quirk]]
name = "worded-enum-values"
reason = "clause 10.1.23 prints Session-Request-Type's values 'AUTHORIZATION REQUEST (0)' and 'ROUTING POLICY (1)'"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "Shall"
replace = "Must"
exact = true
section = "10.1"
reason = "table 10.1.1's first flag column is headed 'Shall', no column name the extractor reads; RFC 3588's [7] AVP table, which its note cites, heads it 'Must', as the document's fourth column 'Must not' implies"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "Authorization -Information-SIM"
replace = "Authorization-Information-SIM"
exact = true
count = 2
section = "10.1"
reason = "a space breaks the name in table 10.1.1's row and clause 10.1.7's heading; the SIP-Auth-Data-Item format in 10.1.4 prints it whole"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "WLAN- 3GPP-IP-Access"
replace = "WLAN-3GPP-IP-Access"
exact = true
section = "10.1"
reason = "a space breaks the name in table 10.1.1's row; clause 10.1.12's heading and the WLAN-User-Data format print it whole"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "Session-Request -Type"
replace = "Session-Request-Type"
exact = true
count = 2
section = "10.1"
reason = "a space breaks the name in table 10.1.1's row and clause 10.1.23's heading; the AAR format of clause 8.4.2 prints it whole"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "The Session-Request -Type AVP is of type Enumerated"
replace = "The Session-Request-Type AVP is of type Enumerated"
section = "10.1.23"
reason = "the sentence opening clause 10.1.23 breaks the name as its heading does"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "WLAN Direct IP Access"
replace = "WLAN-Direct-IP-Access"
exact = true
section = "10.1.17"
reason = "clause 10.1.17's heading writes with spaces the name table 10.1.1 and the WLAN-User-Data format hyphenate"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "The Push-Profile-Request -Request (PPR) command,"
replace = "The Push-Profile-Request (PPR) command,"
section = "6.4.2"
reason = "clause 6.4.2's intro repeats '-Request', and its rule prints Push-Profile-Request"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "[ SIP-Auth-Data-Item ] ]"
replace = "[ SIP-Auth-Data-Item ]"
exact = true
section = "6.4.1"
reason = "the MAA format closes the member twice"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "<Server-Assignment-Request> ::= < Diameter Header: 301, REQ, PXY, XXXX>"
replace = "<Server-Assignment-Request> ::= < Diameter Header: 301, REQ, PXY >"
exact = true
section = "11.4.1"
reason = "clause 11.4.1's header prints the drafting placeholder 'XXXX' for an application id; clause 11.2 states Pr's, 16777230, which the application scope carries"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "<Server-Assignment-Answer> ::= < Diameter Header: 301, PXY, XXXX >"
replace = "<Server-Assignment-Answer> ::= < Diameter Header: 301, PXY >"
exact = true
section = "11.4.1"
reason = "clause 11.4.1's header prints the drafting placeholder 'XXXX' for an application id; clause 11.2 states Pr's, 16777230, which the application scope carries"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "WLAN_ APNS _ENABLE (0)"
replace = "WLAN_APNS_ENABLE (0)"
exact = true
section = "10.1.12"
reason = "clause 10.1.12 breaks the value name with stray spaces; unpatched the value is silently no value"
first_version = "11.2.0"
last_version = "11.2.0"

