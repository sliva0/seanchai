[[patch]]
find = "[ QoS- Resources ]"
replace = "[ QoS-Resources ]"
exact = true
count = 2
section = "10.1"
reason = "the WLAN-User-Data and APN-Authorized formats (10.1.8, 10.1.14) break the name clause 10.1.42 heads"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "[ Charging- Data]"
replace = "[ Charging-Data]"
exact = true
section = "6.4.3"
reason = "the SAA format breaks the name table 10.1.1 prints whole"
first_version = "11.2.0"
last_version = "11.2.0"

[[patch]]
find = "{ 3GPP-WLAN-APN- Id }"
