[[quirk]]
name = "command-reference-only"
reason = """
    Clauses 4.2.2.4.3–4, 5.2.2.3.5–6 and 11.2.2.1.1–2 only refer to other
    command clauses; they print no definition.
    """
first_version = "18.6.0"
last_version = "19.2.0"

[[patch]]
find = "8.2.3.1.3"
replace = "8.2.3.13"
exact = true
section = "7.2.3.1"
reason = """
    Table 7.2.3.1/1 prints the Trace-Info clause reference as 8.2.3.1.3, a
    clause that does not exist; its definition is in clause 8.2.3.13.
    """
first_version = "18.6.0"
last_version = "19.2.0"

[[patch]]
find = "Emergency- Services"
replace = "Emergency-Services"
count = 2
exact = true
reason = """
    Tables 7.2.3.1/1 and 9.2.3.2.1/1 insert a space into the Emergency-Services
    name defined in clause 7.2.3.4.
    """
first_version = "18.6.0"
last_version = "19.2.0"

[[quirk]]
name = "physical-reused-columns"
reason = """
    Table 8.2.3.0/2 has four physical columns but changes the grid spans of
    Comments and M-bit partway through; read its physical cells.
    """
first_version = "18.6.0"
last_version = "19.2.0"

[[quirk]]
name = "independent-avp-tables"
reason = """
    Clauses 5–11 distribute local and re-used tables independently: 9.2.3.1.1
    and 9.2.3.2.1 share 9.2.3.3, while 11.2.3.1 has only re-used AVPs.
    """
first_version = "18.6.0"
last_version = "19.2.0"

[[quirk]]
name = "procedure-commands"
reason = """
    Clauses 8.2.2.1–4 print two command ABNFs per procedure heading; their
    preceding command intros supply the names and abbreviations.
    """
first_version = "18.6.0"
last_version = "19.2.0"

[[quirk]]
name = "prose-avp-origins"
reason = """
    clauses 9.2.3.2.4-5 and 9.2.3.6.4-7 define QoS-Capability,
    QoS-Resources, MIP-MN-HA-SPI and MIP-Session-Key by reference to RFCs
    5777, 5778 and 4004
    """
first_version = "18.6.0"
last_version = "19.2.0"

[[quirk]]
name = "elided-members"
reason = """
    the commands of clauses 4 to 9 print '…' or '...' on a line of its own
    where a rule leaves out what it does not change, between members and
    before '*[ AVP ]'.
    """
first_version = "18.6.0"
last_version = "19.2.0"

[[patch]]
find = "* 2 [ Served-Party-IP-Address ]"
replace = "*2 [ Served-Party-IP-Address ]"
exact = true
section = "5.2.3.26"
reason = """
    clause 5.2.3.26's TWAN-Connectivity-Parameters spaces the qualifier, '*
    2', docx and PDF alike, which RFC 6733's 'qual' does not. Unread, the
    body ended there, dropping the members after it.
    """
first_version = "18.6.0"
last_version = "19.2.0"

[[patch]]
find = "* 2 [ TWAG-CP-Address ]"
replace = "*2 [ TWAG-CP-Address ]"
exact = true
count = 2
reason = """
    two Diameter-EAP-Requests space the qualifier, '* 2', docx and PDF
    alike, which RFC 6733's 'qual' does not. Unread, each body ended there,
    dropping the members after it.
    """
first_version = "18.6.0"
last_version = "19.2.0"

[[patch]]
find = "*[ Redirect-Host ] ]"
replace = "*[ Redirect-Host ]"
exact = true
section = "6.2.2.1.1.2"
reason = """
    clause 6.2.2.1.1.2's Diameter-EAP-Answer closes the member's bracket
    twice, docx and PDF alike. Unread, the body ended there, dropping the
    members after it.
    """
first_version = "18.6.0"
last_version = "19.2.0"

[[patch]]
find = "[ Emergency- Services ]"
replace = "[ Emergency-Services ]"
exact = true
count = 2
reason = """
    clauses 7.2.2.1.1 and 9.2.2.2.1 insert a space into the member's name,
    as tables 7.2.3.1/1 and 9.2.3.2.1/1 do, docx and PDF alike; clause
    7.2.3.4 defines Emergency-Services. Unread, each body ended there,
    dropping the members after it.
    """
first_version = "18.6.0"
last_version = "19.2.0"

[[patch]]
find = "[ OC-OLR ] ]"
replace = "[ OC-OLR ]"
exact = true
count = 2
section = "8.2.2"
reason = """
    clauses 8.2.2.1 and 8.2.2.3 close the member's bracket twice, docx and
    PDF alike. Unread, each body ended there, dropping the members after it.
    """
first_version = "18.6.0"
last_version = "19.2.0"
