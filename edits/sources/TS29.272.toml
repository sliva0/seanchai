# Source declarations for 3GPP TS 29.272 (EPS MME/SGSN interfaces based on
# Diameter). Applied to normalized source text before parsing; see
# src/seanchai/extractor/sources.py for the format.

[[patch]]
find = "M. V"
replace = "M, V"
exact = true
section = "7.3.1"
reason = "AVP-table flags cell uses '.' instead of ',' as separator"
first_version = "18.6.0"
last_version = "18.7.0"

[[patch]]
find = "v"
replace = "V"
exact = true
section = "7.3.1"
reason = "AVP-table flags cell written in lowercase"
first_version = "18.6.0"
last_version = "18.7.0"

[[patch]]
find = "MME-Location Information"
replace = "MME-Location-Information"
exact = true
section = "7.3.1"
reason = "AVP-table name cell line-wrapped, losing a hyphen"
first_version = "18.6.0"
last_version = "18.7.0"

[[patch]]
find = "MODIFIED_ADDED_PDP CONTEXTS_INCLUDED"
replace = "MODIFIED_ADDED_PDP_CONTEXTS_INCLUDED"
section = "7.3.73"
reason = """
    enumerated value name written with a space instead of an underscore, which
    stops it being recognised as a value at all
    """
first_version = "18.6.0"
last_version = "18.7.0"

[[patch]]
find = "Communication-Pattern-set"
replace = "Communication-Pattern-Set"
exact = true
section = "7.3.1"
reason = """
    re-used AVPs table spells the AVP with a lowercase 's', against both TS
    29.336 and this document's own clause 7.3.194
    """
first_version = "18.6.0"
last_version = "18.7.0"

[[patch]]
find = "Monitoring Event Report::="
replace = "Monitoring-Event-Report ::="
section = "7.3.196"
reason = "grouped-AVP rule name written with spaces instead of hyphens"
first_version = "18.6.0"
last_version = "18.7.0"

[[patch]]
find = "Enumerate"
replace = "Enumerated"
exact = true
section = "7.3.1"
reason = """
    table 7.3.1/1 misspells Alert-Reason's type as 'Enumerate', which is not a
    Diameter data type; clause 7.3.83 defines it as Enumerated, as does the TS
    29.230 registry
    """
first_version = "18.6.0"
last_version = "18.7.0"

[[patch]]
find = "SIPTO_above_RAN _"
replace = "SIPTO_above_RAN_"
count = 2
section = "7.3.135"
reason = """
    both SIPTO-Permission value names print a space before the underscore,
    'SIPTO_above_RAN _ALLOWED (0)' (docx and PDF alike); every other value name
    in the document is one underscore-joined token
    """
first_version = "18.7.0"
last_version = "18.7.0"

[[quirk]]
name = "dashed-enum-values"
reason = """
    clause 7.3.128 prints Error-Diagnostic's values as dashed list items, '-
    GPRS_DATA_SUBSCRIBED (0)'; unread, the list was empty
    """
first_version = "18.7.0"
last_version = "18.7.0"

[[quirk]]
name = "external-enum-values"
reason = """
    twelve trace and MDT clauses (7.3.67 Trace-Depth, 7.3.137 Job-Type,
    7.3.141-7.3.169, 7.3.247-7.3.248) print no values and say 'The possible
    values are those defined in TS 32.422 [23] for ...'
    """
first_version = "18.7.0"
last_version = "18.7.0"

[[patch]]
find = "[ IDR- Flags ]"
replace = "[ IDR-Flags ]"
exact = true
section = "7.2.9"
reason = """
    clause 7.2.9's Insert-Subscriber-Data-Request (the first of its two
    copies, S6a/S6d) prints a space inside the name, docx and PDF alike;
    clause 7.3.103 defines IDR-Flags. Unread, the body ended there, dropping
    the members after it.
    """
first_version = "18.7.0"
last_version = "18.7.0"

[[patch]]
find = "* 2 [ Served-Party-IP-Address ]"
replace = "*2 [ Served-Party-IP-Address ]"
exact = true
section = "7.3.35"
reason = """
    clause 7.3.35's APN-Configuration spaces the qualifier, '* 2', docx and
    PDF alike, which RFC 6733's 'qual' does not. Unread, the body ended
    after Context-Identifier.
    """
first_version = "18.7.0"
last_version = "18.7.0"

[[patch]]
find = "1 * { TS-Code }* [ AVP ]"
replace = "1*{ TS-Code } *[ AVP ]"
exact = true
section = "7.3.99"
reason = """
    clause 7.3.99's Teleservice-List prints its two members on one line with
    its qualifiers spaced, '1 * { TS-Code }* [ AVP ]', docx and PDF alike.
    Unread, the body was empty.
    """
first_version = "18.7.0"
last_version = "18.7.0"

[[patch]]
find = "[ Collection-Period- RRM-LTE ]"
replace = "[ Collection-Period-RRM-LTE ]"
exact = true
section = "7.3.136"
reason = """
    clause 7.3.136's MDT-Configuration prints a space inside the name, docx
    and PDF alike; the clause defining Collection-Period-RRM-LTE has none.
    Unread, the body ended there, dropping the members after it.
    """
first_version = "18.7.0"
last_version = "18.7.0"

[[patch]]
find = "1 * { RAT-Type }"
replace = "1*{ RAT-Type }"
exact = true
section = "7.3.229"
reason = """
    clause 7.3.229's eDRX-Related-RAT spaces the qualifier, '1 * { RAT-Type
    }', docx and PDF alike, which RFC 6733's 'qual' does not. Unread, the
    body was empty.
    """
first_version = "18.7.0"
last_version = "18.7.0"

[[patch]]
find = "Requested-UTRAN- GERAN-Authentication-Info"
replace = "Requested-UTRAN-GERAN-Authentication-Info"
exact = true
section = "7.3.12"
reason = """
    clause 7.3.12's heading prints a space inside the name, docx and PDF alike;
    table 7.3.1/1 and the clause's own rule print none. Unread, the heading
    named no AVP and its grouped rule was not read at all.
    """
first_version = "18.7.0"
last_version = "18.7.0"

[[patch]]
find = "Table 7.3.200 -1:"
replace = "Table 7.3.200-1:"
count = 1
section = "7.3.200"
reason = """
a stray space in the caption of the Supported-Monitoring-Events bit table, which
no caption reading takes; 7.3.200-1 is the label clause 7.3.200 cites
"""
first_version = "18.7.0"
last_version = "18.7.0"
