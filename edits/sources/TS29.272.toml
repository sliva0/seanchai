# Input patches for 3GPP TS 29.272 (EPS MME/SGSN interfaces based on Diameter).
# Applied to normalized source text before parsing; see
# src/seanchai/extractor/patches.py for the format.

[[patch]]
find = "M. V"
replace = "M, V"
exact = true
section = "7.3.1"
reason = "AVP-table flags cell uses '.' instead of ',' as separator"
first_version = "18.6.0"
last_version = "18.6.0"

[[patch]]
find = "v"
replace = "V"
exact = true
section = "7.3.1"
reason = "AVP-table flags cell written in lowercase"
first_version = "18.6.0"
last_version = "18.6.0"

[[patch]]
find = "MME-Location Information"
replace = "MME-Location-Information"
exact = true
section = "7.3.1"
reason = "AVP-table name cell line-wrapped, losing a hyphen"
first_version = "18.6.0"
last_version = "18.6.0"

[[patch]]
find = "MODIFIED_ADDED_PDP CONTEXTS_INCLUDED"
replace = "MODIFIED_ADDED_PDP_CONTEXTS_INCLUDED"
section = "7.3.73"
reason = "enumerated value name written with a space instead of an underscore, which stops it being recognised as a value at all"
first_version = "18.6.0"
last_version = "18.6.0"

[[patch]]
find = "Communication-Pattern-set"
replace = "Communication-Pattern-Set"
exact = true
section = "7.3.1"
reason = "re-used AVPs table spells the AVP with a lowercase 's', against both TS 29.336 and this document's own clause 7.3.194"
first_version = "18.6.0"
last_version = "18.6.0"

[[patch]]
find = "Monitoring Event Report::="
replace = "Monitoring-Event-Report ::="
section = "7.3.196"
reason = "grouped-AVP rule name written with spaces instead of hyphens"
first_version = "18.6.0"
last_version = "18.6.0"

[[patch]]
find = "Enumerate"
replace = "Enumerated"
exact = true
section = "7.3.1"
reason = "table 7.3.1/1 misspells Alert-Reason's type as 'Enumerate', which is not a Diameter data type; clause 7.3.83 defines it as Enumerated, as does the TS 29.230 registry"
first_version = "18.6.0"
last_version = "18.6.0"
