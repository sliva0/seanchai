# Source declarations for 3GPP TS 29.345 (Inter-ProSe function signalling).
# Applied to normalized source text before parsing; see
# src/seanchai/extractor/sources.py for the format.

[[patch]]
find = "M. V"
replace = "M, V"
count = 2
exact = true
section = "6.3.1"
reason = """
    table 6.3.1-1 uses '.' instead of ',' as the flag separator for
    ProSe-App-Code-Info and UTC-based-Counter
    """
first_version = "18.0.0"
last_version = "19.0.0"

[[patch]]
find = "Group"
replace = "Grouped"
exact = true
section = "6.3.1"
reason = """
    table 6.3.1-1 calls App-Identifier's type Group; clause 6.3.61 defines it as
    Grouped and Group is not a Diameter data type
    """
first_version = "18.0.0"
last_version = "19.0.0"

[[patch]]
find = "Assistance-info"
replace = "Assistance-Info"
exact = true
section = "6.3.1"
reason = """
    table 6.3.1-1 lower-cases Info, as clause 6.3.3's heading does; the clause's
    rule and prose, the ALR rule (6.2.15) and table 5.9.1's row write
    Assistance-Info
    """
first_version = "18.0.0"
last_version = "19.0.0"

[[patch]]
find = "MIC-Check-indicator"
replace = "MIC-Check-Indicator"
exact = true
section = "6.3.1"
reason = """
    table 6.3.1-1 lower-cases Indicator; clause 6.3.80's heading and prose and
    the Match-Report rule (6.3.75) write MIC-Check-Indicator
    """
first_version = "18.0.0"
last_version = "19.0.0"

[[patch]]
find = "*AVP"
replace = "*[ AVP ]"
exact = true
count = 2
reason = """
    clauses 6.3.32 and 6.3.33 print the extension member without its
    brackets, '*AVP'; the document's other grouped AVPs print '*[AVP]'.
    Unread, each body lost it.
    """
first_version = "18.0.0"
last_version = "19.0.0"

[[patch]]
find = "[ ProSe-Validity Timer ]"
replace = "[ ProSe-Validity-Timer ]"
exact = true
section = "6.3.54"
reason = """
    clause 6.3.54's Discovery-Auth-Response prints a space for a hyphen,
    docx and PDF alike; the clause defining ProSe-Validity-Timer has none.
    Unread, the body ended there, dropping the members after it.
    """
first_version = "18.0.0"
last_version = "19.0.0"

[[patch]]
find = "[ User Identity ]"
replace = "[ User-Identity ]"
exact = true
section = "6.3.55"
reason = """
    clause 6.3.55's Match-Request prints a space for a hyphen, docx and PDF
    alike; the document's other bodies print '[ User-Identity ]'. Unread,
    the body ended there, dropping the members after it.
    """
first_version = "18.0.0"
last_version = "19.0.0"

[[patch]]
find = "[ Ending–Suffix ]"
replace = "[ Ending-Suffix ]"
exact = true
count = 2
reason = """
    clauses 6.3.68 and 6.3.82 print an en dash in the name, docx and PDF
    alike; Beginning-Suffix beside it and the AVP table's Ending-Suffix have
    a hyphen. Unread, each body lost it.
    """
first_version = "18.0.0"
last_version = "19.0.0"
