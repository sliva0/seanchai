# Source declarations for 3GPP TS 29.230 (Diameter applications; 3GPP
# specific codes and identifiers). Applied to normalized source text before
# parsing; see src/seanchai/extractor/sources.py for the format.

[[quirk]]
name = "registry-tables"
reason = """
    the document allocates codes rather than defining them: tables 4.1
    (application identifiers), 5.1/1-5.1/4 (command codes), 7.1 (AVP codes) and
    8.1.2-8.1.4 (experimental result codes) give each code the 3GPP TS
    'specified in'
    """
first_version = "18.6.0"
last_version = "18.6.0"

[[quirk]]
name = "reserved-range-notes"
reason = """
    tables 7.1 and 8.1.2-8.1.4 reserve ranges in full-width note rows, 'Note:
    The AVP codes from 320 to 399 are reserved for TS 29.234'; annex A.3 and A.4
    describe the allocation of such ranges
    """
first_version = "18.6.0"
last_version = "18.6.0"

[[patch]]
find = "29.153[37]"
replace = "29.153 [37]"
exact = true
count = 1
section = "4.1"
reason = """
    table 4.1's Ns row runs the reference into the document number; clause 2's
    reference [37] is TS 29.153
    """
first_version = "18.6.0"
last_version = "18.6.0"

[[patch]]
find = "29.154[38]"
replace = "29.154 [38]"
exact = true
count = 1
section = "4.1"
reason = """
    table 4.1's Nt row runs the reference into the document number; clause 2's
    reference [38] is TS 29.154
    """
first_version = "18.6.0"
last_version = "18.6.0"

[[quirk]]
name = "unknown-type-tokens"
reason = """
    table 7.1 types Charging-Characteristics (314, TS 29.234 [6]) 'Integer',
    which names no Diameter type and could be Integer32, Integer64 or neither;
    TS 29.234 is outside the corpus, so the cell is kept as printed rather than
    patched to a guess (Wireshark's TGPP.xml types 314 OctetString)
    """
first_version = "18.6.0"
last_version = "18.6.0"

