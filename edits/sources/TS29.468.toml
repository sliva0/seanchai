[[quirk]]
name = "prose-application-ids"
reason = "the command headers print no application id; clause 6.1.3 states it: 'The Diameter application identifier assigned to the MB2-C interface application is 16777335.'"
first_version = "18.0.0"
last_version = "18.0.0"

[[quirk]]
name = "applicability-column"
reason = "tables 6.4.1-1 and 6.5.1-1 print an 'Applicability' column of supported features ('ROHC, FEC', 'V2X Localized User Plane'): note 2, 'AVPs marked with a supported feature are applicable as described in clause 6.5.2'"
first_version = "18.0.0"
last_version = "18.0.0"

[[quirk]]
name = "worded-marks"
reason = "the 'V2X Localized User Plane' and 'MBMS Cell List' features are named in words (clauses 4.1, 5.3.2), separated from each other by commas ('ROHC, FEC')"
first_version = "18.0.0"
last_version = "18.0.0"
