# Source declarations for 3GPP TS 29.561 (5G interworking with data networks).

[[quirk]]
name = "document-clause-cells"
reason = """
    table 12.4-1's 'Section defined' column holds this document's clause for
    its own AVPs ('11.3.1') and another document for those it re-uses, '3GPP TS
    29.061 [5] (NOTE 3)' and '3GPP TS 29.229 [41]'
    """
first_version = "19.6.0"
last_version = "19.6.0"

[[quirk]]
name = "clause-parenthetical"
reason = """
    tables 12.4-1 and 17.4-1 annotate clause cells '(NOTE 3)', the note about
    RADIUS VSAs carried as Diameter vendor AVPs per RFC 7155
    """
first_version = "19.6.0"
last_version = "19.6.0"

[[quirk]]
name = "procedure-commands"
reason = """
    clauses 12.6.2 to 12.6.5 are headed 'DER Command', naming a command by its
    abbreviation alone, over '<Diameter-EAP-Request>'
    """
first_version = "19.6.0"
last_version = "19.6.0"

[[quirk]]
name = "rfc-command-rules"
reason = """
    the intros print the abbreviation alone, 'The DER command, defined in IETF
    RFC 4072 [25]'; every command is RFC 4072's or RFC 7155's, which name them
    by command code
    """
first_version = "19.6.0"
last_version = "19.6.0"

[[quirk]]
name = "applicability-column"
reason = """
    table 12.4-1 prints an 'Applicability' column naming the feature
    eSessionAMBR, which table 12.4.1-1 defines
    """
first_version = "19.6.0"
last_version = "19.6.0"

[[quirk]]
name = "worded-marks"
reason = """
    table 12.4-1 marks 3GPP-Policy-Reference 'NOTE 4', which is one mark of two
    words: 'It is not used in this release'
    """
first_version = "19.6.0"
last_version = "19.6.0"

[[patch]]
find = "3GPP-Charging-ID"
replace = "3GPP-Charging-Id"
count = 2
section = "12.6"
reason = """
    the DER body (clause 12.6.2) misspells in case 3GPP-Charging-Id and
    3GPP-Charging-Id-v2, the names table 12.4-1 prints
    """
first_version = "19.6.0"
last_version = "19.6.0"
