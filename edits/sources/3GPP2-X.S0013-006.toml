[[patch]]
find = "< AVP header: 632, 10415 >"
replace = "< AVP header: 632 10415 >"
section = "6.3.33"
reason = """
    clause 6.3.33's AVP format puts a comma between code and vendor-id, which no
    other AVP format of the document does; table 6.3.1 gives code 632 and clause
    6.3 the vendor 10415
    """
first_version = "1.0"
last_version = "1.0"
