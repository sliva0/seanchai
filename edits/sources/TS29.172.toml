# Source declarations for 3GPP TS 29.172 (EPC LCS Protocol (ELP) between the
# GMLC and the MME; SLg interface). Applied to normalized source text before
# parsing; see src/seanchai/extractor/sources.py for the format.

[[patch]]
find = "VERTICAL_COORDINATE_IS_NOT REQUESTED (0)"
replace = "VERTICAL_COORDINATE_IS_NOT_REQUESTED (0)"
exact = true
section = "7.4.9"
reason = """
    Vertical-Requested's value 0 prints a space for an underscore, which kept it
    out of the value list; the clause's own default sentence spells it
    VERTICAL_COORDINATE_IS_NOT_REQUESTED (0)
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[quirk]]
name = "worded-enum-values"
reason = """
    clause 7.4.27 labels LCS-QoS-Class's value 1 in words, 'BEST EFFORT (1)'
    """
first_version = "18.1.0"
last_version = "18.1.0"

[[patch]]
find = "[ 1xRTT-RCID ] ]"
replace = "[ 1xRTT-RCID ]"
exact = true
section = "7.3.3"
reason = """
    clause 7.3.3's Location-Report-Request closes the member's bracket
    twice, '[ 1xRTT-RCID ] ]', docx and PDF alike. Unread, the body ended
    there, dropping the members after it.
    """
first_version = "18.1.0"
last_version = "18.1.0"
